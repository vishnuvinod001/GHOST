<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1018">
  <title>GHOST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/core/variables.css">
  <link rel="stylesheet" href="/static/css/core/global.css">
  <link rel="stylesheet" href="/static/css/core/animations.css">
  <link rel="stylesheet" href="/static/css/core/responsive.css">
  <link rel="stylesheet" href="/static/css/layout/layout.css">
  <link rel="stylesheet" href="/static/css/components/sidebar.css">
  <link rel="stylesheet" href="/static/css/components/workspace.css">
  <link rel="stylesheet" href="/static/css/components/chat.css">
  <link rel="stylesheet" href="/static/css/components/cards.css">
  <link rel="stylesheet" href="/static/css/pages/overview.css">
  <link rel="stylesheet" href="/static/css/pages/knowledge.css">
  <link rel="stylesheet" href="/static/css/pages/files.css">
  <link rel="stylesheet" href="/static/css/pages/brain.css">
  <link rel="stylesheet" href="/static/css/pages/tasks.css">
  <link rel="stylesheet" href="/static/css/pages/developer.css">
  <link rel="stylesheet" href="/static/css/pages/settings.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-mark" aria-hidden="true">G</div>
        <div><h1>GHOST</h1><span>PERSONAL AI SYSTEM</span></div>
      </div>
      <nav class="navigation" aria-label="Main navigation">
        <span class="nav-section-label">WORKSPACE</span>
        <button class="nav-button active" data-page="overview" aria-current="page"><span class="nav-indicator"></span>Overview</button>
        <button class="nav-button" data-page="knowledge"><span class="nav-indicator"></span>Knowledge</button>
        <button class="nav-button" data-page="files"><span class="nav-indicator"></span>Files</button>
        <button class="nav-button" data-page="tasks"><span class="nav-indicator"></span>Tasks</button>
        <span class="nav-section-label">SYSTEM</span>
        <button class="nav-button" data-page="brain"><span class="nav-indicator"></span>Brain</button>
        <button class="nav-button" data-page="developer"><span class="nav-indicator"></span>Developer</button>
        <button class="nav-button" data-page="settings"><span class="nav-indicator"></span>Settings</button>
      </nav>
      <div class="sidebar-footer"><span class="online-indicator"></span><span>Local environment</span></div>
    </aside>

    <main class="workspace">
      <header class="page-header">
        <div><span class="header-kicker">GHOST SYSTEM</span><h2 id="current-page-title">Overview</h2></div>
        <div class="header-status"><span class="online-indicator"></span>LOCAL SESSION</div>
      </header>
      <section id="page-content" class="page-content" aria-live="polite"></section>
    </main>

    <aside class="chat-panel" aria-label="Chat with GHOST">
      <header class="chat-header">
        <div class="chat-avatar">G</div>
        <div><h2>GHOST</h2><span><i class="online-indicator"></i> Connected to AI environment</span></div>
        <span class="chat-header-spacer"></span>
        <span class="chat-version-mark">AI</span>
      </header>
      <section id="chat-history" class="chat-history" aria-live="polite">
        <div class="chat-welcome"><span class="welcome-orbit">G</span><strong>Systems ready.</strong><p>Your conversation is connected to the GHOST backend.</p></div>
      </section>
      <footer class="chat-input">
        <input id="message" type="text" placeholder="Message GHOST..." autocomplete="off" aria-label="Message GHOST">
        <button id="send-button" type="button" aria-label="Send message">Send</button>
      </footer>
      <div class="chat-footnote">LOCAL MODEL · PRIVATE WORKSPACE</div>
    </aside>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/pages.js"></script>
  <script src="/static/js/overview.js"></script>
  <script src="/static/js/knowledge.js"></script>
  <script src="/static/js/files.js"></script>
  <script src="/static/js/tasks.js"></script>
  <script src="/static/js/brain.js"></script>
  <script src="/static/js/developer.js"></script>
  <script src="/static/js/settings.js"></script>
  <script src="/static/js/navigation.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
