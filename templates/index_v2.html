<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST v0.5</title>

    <!-- Core -->
    <link rel="stylesheet" href="/static/css/core/variables.css">
    <link rel="stylesheet" href="/static/css/core/global.css">
    <link rel="stylesheet" href="/static/css/core/animations.css">
    <link rel="stylesheet" href="/static/css/core/responsive.css">

    <!-- Layout -->
    <link rel="stylesheet" href="/static/css/layout/layout.css">

    <!-- Components -->
    <link rel="stylesheet" href="/static/css/components/sidebar.css">
    <link rel="stylesheet" href="/static/css/components/workspace.css">
    <link rel="stylesheet" href="/static/css/components/chat.css">
    <link rel="stylesheet" href="/static/css/components/cards.css">

    <!-- Pages -->
    <link rel="stylesheet" href="/static/css/pages/overview.css">
    <link rel="stylesheet" href="/static/css/pages/knowledge.css">


</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <div class="logo">
                <h1>GHOST</h1>
            </div>

            <nav class="navigation">

                <button class="nav-button active" data-page="overview">
                    Overview
                </button>

                <button class="nav-button" data-page="knowledge">
                    Knowledge
                </button>

                <button class="nav-button" data-page="files">
                    Files
                </button>

                <button class="nav-button" data-page="tasks">
                    Tasks
                </button>

                <button class="nav-button" data-page="brain">
                    Brain
                </button>

                <button class="nav-button" data-page="developer">
                    Developer
                </button>

                <button class="nav-button" data-page="settings">
                    Settings
                </button>

            </nav>

        </aside>

        <main class="workspace">

            <header class="page-header">
                <h2>Overview</h2>
            </header>

            <section id="page-content" class="page-content">

            </section>

        </main>

        <aside class="chat-panel">

            <header class="chat-header">
                <h2>GHOST</h2>
            </header>

            <section id="chat-history">

            </section>

            <footer class="chat-input">

                <input id="message" type="text" placeholder="Ask GHOST">

                <button>
                    Send
                </button>

            </footer>

        </aside>

    </div>


    <script src="/static/js/pages.js"></script>
    <script src="/static/js/navigation.js"></script>
    <script src="/static/js/app.js"></script>

</body>

</html>
